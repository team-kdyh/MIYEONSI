goal: AFTER HOURS를 선택지 없는 OpenAI 중심 캐릭터 대화형 비주얼 노벨로 개편한다. 자유 대화가 사건·관계·장소·결말을 실질적으로
  바꾸고, 화면 전체 배경·풍부한 2D 캐릭터 동작·하단 채팅·상황별 음악·추가 원본 에셋을 갖추도록 한다. 실제 Ralph 반복과 실제 대화/화면
  검증으로 품질 결함을 수정하고 검증 가능한 출시 후보를 전달한다.
task_type: code
brownfield_context:
  project_type: brownfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- 최신 사용자 요구가 이전 Seed의 3지선다/3턴 챕터/크림색 UI와 v1 provider 보존 조건보다 우선한다. 사용자 원문과 구체적 방향은
  AGENTS.md 활성 v2 절, .ralph/v2-director.md, .ralph/v2-experience-review.md에 있다. 기존의
  local Windows TypeScript React/Vite Express 프로젝트를 실제로 개편한다.
- 프로젝트 원본 경로는 C:/Users/gjtjw/Desktop/대화형 스토리진행. 새로운 .ralph/v2-media와 .ralph/v2-audio의
  원본 자산은 부모가 병렬 생성 중이며 완료 manifest를 읽어 작업 트리의 public/assets/v2와 public/assets/audio-v2로
  복사한다. 부모와 파일 충돌 없이 기존 원본/증거/플레이어 데이터를 보존한다. 신규 음원8개 ID와 포즈 시트 목록은 AGENTS.md에 있다.
- 원본 스토리/미술/음악을 만든다. DDLC의 무대·하단 대사·음악 리듬, Toptoon Chat의 인물 대화 중심 경험을 공식 자료로 연구하되
  저작물을 복제하지 않는다. 로맨스 인물은 성인. 비노골적인 로맨스·심리 스릴러, 실제 개인정보/바탕화면 접근 주장 없음.
- API는 공식 Responses API와 엄격한 구조화 출력으로 연결하되, 의미적으로 새로운 사건을 허용한다. 숨은 고정3답 intent enum으로
  구현하지 않는다. 상태 무결성은 서버가 담당하되 사용자 대사와 NPC 일반 행동을 지나치게 억압하는 기존 제한은 개편한다. 플레이어의 대사/동의/행동을
  지어내지 않는다.
- 사용자는 자신의 OpenAI 키 사용과 이번 개편의 실제 챗봇 검증을 요청했다. 기존 docs/api-smoke-ledger.json의12회를
  그대로 보존한다. 부모가 공개한 새 단계 한도는 추가32회(누적44회), 호출당 출력1600토큰 이하. docs/v2-api-smoke-ledger.json에
  요청 전에 예약하고 실패도 집계한다. final conversational-QA owner만 유료 호출하며 일반 자동테스트는 mock/빈 키다.
  사용자 지정 금액예산으로 표현하지 않는다. 기본 모델은 품질을 위한 gpt-4.1을 고려하고 env override 및 실제 접근/응답을 검증한다.
- API키 원문을 프롬프트·명세·출력·소스·Git·브라우저·배포 ZIP에 넣지 않는다. 키는 이미 원본 .env에 있으며 부모가 필요시 작업트리에
  안전하게 제공한다. .env를 읽어 출력하지 않는다. 소스 변경이 정당하게 요청된 단계이므로 v1 실호출 해시와 달라져도 되지만 v2 검증은 새
  소스 해시와 연결한다.
- Ralph가 실제 실행/평가 반복을 소유한다. 런타임0.63.0. 판정기/기준을 고쳐 합격시키지 않는다. 과거 6/7 경로 검사 오류와 독립0.94는
  역사적 기록으로 남긴다. 새로운 objective의 실제 미완료를 이전 수치로 덮지 않는다.
- 로컬 플레이 가능한 출시 후보와 검증 가능한 전달물까지 자율적으로 진행한다. 공개 호스팅/결제/스토어 등록/타인에게 메시지 전송은 범위 밖이다.
  품질 평가는 자명한 기능 체크뿐 아니라 실제 한국어 대화와 미술·UI 화면 비평을 포함한다.
acceptance_criteria:
- description: 두 모드의 플레이 화면은 전체 뷰포트의 원본 배경과 큰 캐릭터, 반투명 하단 대사·행동 지문·자유 텍스트 입력으로 구성된다.
    이야기 답변 선택지/추천 답변 버튼, 흰색·크림색 문서 영역, 상시 합의표·규칙 패널, 반복 출력하는 고정 장문이 없다. 타이틀·모드/미션
    선택·저장·로그·설정 메뉴는 허용한다. 1440x900과 390x844에서 캐릭터 얼굴과 입력/전송을 함께 볼 수 있고 가로 넘침이나 전체
    페이지 스크롤 없이 긴 대화도 이용한다. 키보드/효과 감소/읽기 속도/음량이 동작하며 실제 화면 캡처를 확인한다.
  semantic_ac_key: ac_44ea22d8f89565cd
- description: OpenAI가 기본 캐릭터 대화와 스토리 진행을 담당한다. 키가 있는 설치의 새/기존 브라우저에서 OpenAI 대화로 시작하고
    오프라인은 명시적 연출 체험으로만 선택한다. 모델은 실제 자유 입력에 대한 새로운 한국어 대사, NPC 행동·감정·포즈, 새 세부 내용이 있는
    사건/약속/이동/관계 제안을 생성한다. 기존 choices 3개 또는 고정 답변 intent로 몰래 환원하지 않는다. 서버는 합리적인 사건의
    정합성·플레이어 주도권·지속성·결말 조건을 검증한다. 같은 저장 상태의 창의적 대안/수락/거절은 두 모드 모두 이후 사건 또는 관계/장소/결과에
    관찰 가능한 차이를 만든다.
  semantic_ac_key: ac_7a9e2ff2bfcffe9c
- description: 박도현의 직장 8미션은 고유 문제와 저항·유머·반론을 유지하며 기존 정답에 없는 합리적인 업무 대안도 협상 결과를 바꾼다.
    서유나(27)의 원본 로맨스는 상호 알아감·호감·고백·연인 관계·실제 데이트·녹음 편집 집착·진실 대면과 최소4가지 주제적 결말을 갖춘다.
    거절한 플레이어를 강제로 연인으로 만들지 않는다. 대화 사건이 장면 속도와 중간 사건을 바꾸며 3턴 강제 장 이동을 없앤다. 4턴 이상 잡담해도
    무관한 다음 장으로 밀어내지 않고, 새 취향/이름/약속이 최소10턴 대화와 저장 복원 뒤 주체를 혼동하지 않고 후속 사건에 반영된다.
  semantic_ac_key: ac_06a91e361c571786
- description: 원본 캐릭터 둘은 각 최소12개 구별되는 2D 표정/자세(기존4+신규8)를 실제 일러스트로 사용한다. 동일 인물 정체성을
    유지하고 새 자세·배경 최소2개를 통합한다. 대화의 서로 다른 반응에서 실제 포즈가 바뀌고 짧은 행동 비트·입장/전환이 실행된다. 텍스트 포즈
    이름이나 같은 그림의 CSS 흔들림만으로 동작 수를 채우지 않는다. 배경/포즈가 현재 확정된 장소/사건과 일치하고 효과 감소에서도 정보가 유지된다.
    모든 신규 파일은 프로젝트에 포함되고 생성 프롬프트·출처 manifest와 실제 화면 증거가 있다.
  semantic_ac_key: ac_ade06cd1239ee8d6
- description: 최소8개의 서로 다른 오리지널 음악을 사용하며 단순 같은 멜로디의 이조가 아니라 선율/편성/템포/분위기가 구별된다. 각
    곡은 최소48초이고 정상 대표 대화/사건 경로에서 최소6개의 음악 ID 전환을 확인한다. 직장 농담/압박, 카페 친밀감, 데이트, 우울·회상,
    미스터리, 대면, 해소에 대응하며 크로스페이드·최소 유지 시간·음소거·음량이 작동한다. 재생·파일 길이/파형/출처와 실제 청취 확인 범위를
    정직하게 기록한다.
  semantic_ac_key: ac_c3c874c4ad1df046
- description: 자동 저장·수동3슬롯·대화/사건/약속·해금·설정과 중복 요청/취소/재시작 복구가 새 AI 스토리 상태에도 적용된다. 기존
    플레이어 저장과 v1 검증 자료는 삭제하지 않으며 구버전 저장을 안전하게 읽거나 마이그레이션한다. 키는 서버 .env에만 있고 클라이언트/로그/패키지에
    노출되지 않는다. 입력/출력·이력·요청 동시성·빈도 제한, schema/asset 검증, 타임아웃/재시도 및 상태 조작/프롬프트 주입 방어가
    있다. 모델 오류를 오프라인 성공으로 위장하지 않고 페이지 열기만으로 유료 호출하지 않는다.
  semantic_ac_key: ac_0b7d7a094aef1816
- description: 출시 후보는 Windows play.cmd/stop.cmd와 README로 실행되고 타입 검사·빌드 및 의미 있는 자동/브라우저
    회귀 검증을 통과한다. 실제 OpenAI 다중 턴 대화(대조적인 직장 흐름, 10턴 이상 로맨스 연속 대화, 기억/새 약속/거절/창의적 대안)를
    제한된 새 호출 원장 안에서 관찰한다. 각 입력·응답·확정 사건과 코드 해시, 반사실 결과, 두 화면 크기 스크린샷, 음악/동작 증거, 실제
    발견 결함과 수정, 출처·남은 한계를 docs/v2-QA.md에 기록한다. 독립 비평은 응답성/인물성/기억/사건 영향/속도/시각 가독성을 실제
    자료로 평가한다. 모의 테스트와 이전 버전 등급을 새 챗봇 품질 증거로 대체하지 않으며 상용 출시 보증을 주장하지 않는다.
  semantic_ac_key: ac_bdc7b3b00c373c36
